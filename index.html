<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0%;
    }
    
    
    .left{
        float: left;
        background-color: beige;
        width: 50%;
        cursor: url("spider.png"), auto;
        height: 1000px;

    }
    .right{
        float: right;
        background-color: blueviolet;
        width: 50%;
        cursor: url("sperrow.png"), auto;
        height: 1000px;
    }
    div{
        font-size: 20px;
        font-weight: 300;
        text-shadow: 2px 3px 5px yellow;
    }


</style>
<body>
    <div class="left">Hello</div>

    <div class="right">World</div>
    
</body>
</html>
